name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browsers and system dependencies
        run: npm exec -- playwright install --with-deps chromium firefox webkit
      - name: Run all checks
        shell: bash
        run: npm run check 2>&1 | tee check.log
      - name: Save failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-failure-reports
          path: |
            check.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
