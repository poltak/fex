name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'github-pages' || format('check-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch') }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      # This runs the complete check once. Its build and browser tests use the root path.
      - name: Run all checks
        shell: bash
        run: set -o pipefail; pnpm run check 2>&1 | tee check.log
      - name: Save check failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-failure-reports
          path: |
            check.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  pages-build:
    name: Build Pages site
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.metadata.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Read Pages configuration without enabling it
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            signal: AbortSignal.timeout(15000),
          });
          let enabled = false;
          let reason;
          if (response.status === 404) {
            reason = 'GitHub Pages is not enabled for this repository.';
          } else if (response.ok) {
            const site = await response.json();
            enabled = site.build_type === 'workflow';
            reason = enabled ? 'GitHub Pages is configured to use GitHub Actions.' : 'GitHub Pages is not configured to use GitHub Actions.';
          } else {
            throw new Error(`Could not read GitHub Pages configuration: HTTP ${response.status}.`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${reason}\n\n` + (enabled
            ? 'The workflow will validate, build, and deploy the site.\n'
            : 'The workflow will build for `/fex/`, but deployment is skipped. Open **Settings → Pages**, set **Source** to **GitHub Actions**, then run **Check and deploy** from the **Actions** tab on `main`. This workflow does not enable Pages through the API.\n'));
          NODE
      - name: Configure enabled Pages site
        if: steps.metadata.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # This builds the deployment path only. It does not run the test suite again.
      - name: Build for the Pages path
        shell: bash
        env:
          FEX_BASE_PATH: ${{ steps.metadata.outputs.enabled == 'true' && (steps.pages.outputs.base_path || '/') || '/fex/' }}
          FEX_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee pages-build.log
          pnpm run check:size 2>&1 | tee -a pages-build.log
      - name: Upload Pages artifact
        if: steps.metadata.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Save Pages build failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pages-build-failure-reports
          path: |
            pages-build.log
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy Pages
    # This job can write to Pages, so it keeps its own branch and event condition.
    if: needs.pages-build.outputs.pages_enabled == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
